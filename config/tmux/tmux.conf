# Avoid tmux pushing OSC 52 to the host terminal.
set-option -s set-clipboard off

# Repeat window for pane resize bindings
set-option -g repeat-time 1000

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded."

# tmux-power's default status-left shows "user@host" + session; override to
# show only the session. Colors mirror the 'sky' theme.
set -g status-left "#[fg=#87ceeb,bg=#3a3a3a]   #S #[fg=#3a3a3a,bg=#262626]"

# Window
bind ^t last-window
bind ^p select-window -t :-
bind ^n select-window -t :+
bind '\' split-window -h
bind - split-window -v

# Pane (vi-style)
bind ^h select-pane -L
bind ^j select-pane -D
bind ^k select-pane -U
bind ^l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Copy mode (tmux-yank handles 'y' for system clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind p paste-buffer

# Pane border shows current path and process name
set-option -g pane-border-status top
set-option -g pane-border-format "#{pane_current_path} #(ps -t #{pane_tty} -o args -O-c)"
