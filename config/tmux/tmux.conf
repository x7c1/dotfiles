# Avoid tmux pushing OSC 52 to the host terminal.
set-option -s set-clipboard off

# Repeat window for pane resize bindings
set-option -g repeat-time 1000

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded."

# Status bar (uses catppuccin variables, so this must come after the plugin loads)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Window
bind ^t last-window
bind ^p select-window -t :-
bind ^n select-window -t :+
bind '\' split-window -h
bind - split-window -v

# Pane (vi-style)
bind ^h select-pane -L
bind ^j select-pane -D
bind ^k select-pane -U
bind ^l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Copy mode (tmux-yank handles 'y' for system clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind p paste-buffer

# Pane border shows current path and process name
set-option -g pane-border-status top
set-option -g pane-border-format "#{pane_current_path} #(ps -t #{pane_tty} -o args -O-c)"
